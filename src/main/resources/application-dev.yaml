spring:
  cache:
    type: redis
    cache-names: users,tasks
    redis:
      time-to-live: ${CACHE_TTL:10m}
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:task-management-notifications}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.portfolio.task_management_system.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    com.portfolio.task_management_system: DEBUG

security:
  jwt:
    # secret: ${JWT_SECRET:62f2f75c18764dd9be731dfb2d3c3c842667105ba718bc7eddfa459b6f264ca1}
    secret: 62f2f75c18764dd9be731dfb2d3c3c842667105ba718bc7eddfa459b6f264ca1
    expiration-ms: ${JWT_EXPIRATION_MS:3000000}

rate-limit:
  capacity: ${RATE_LIMIT_CAPACITY:100}
  refill-duration: ${RATE_LIMIT_REFILL_DURATION:1m}
  cleanup-interval: ${RATE_LIMIT_CLEANUP_INTERVAL:5m}
  bucket-ttl: ${RATE_LIMIT_BUCKET_TTL:15m}

app:
  kafka:
    topics:
      task-events: ${TASK_EVENTS_TOPIC:task-events}
  notifications:
    digest-rate: ${NOTIFICATION_DIGEST_RATE:1h}
