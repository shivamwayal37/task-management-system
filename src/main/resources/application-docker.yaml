spring:
  cache:
    type: redis
    cache-names: users,tasks
    redis:
      time-to-live: ${CACHE_TTL:10m}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:30000}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:task-management-notifications}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.portfolio.task_management_system.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate.SQL: WARN
    com.portfolio.task_management_system: INFO

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3000000}

rate-limit:
  capacity: ${RATE_LIMIT_CAPACITY:100}
  refill-duration: ${RATE_LIMIT_REFILL_DURATION:1m}
  cleanup-interval: ${RATE_LIMIT_CLEANUP_INTERVAL:5m}
  bucket-ttl: ${RATE_LIMIT_BUCKET_TTL:15m}

app:
  kafka:
    topics:
      task-events: ${TASK_EVENTS_TOPIC:task-events}
  notifications:
    digest-rate: ${NOTIFICATION_DIGEST_RATE:1h}
    dashboard-url: ${NOTIFICATION_DASHBOARD_URL:http://localhost:8080/dashboard}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
