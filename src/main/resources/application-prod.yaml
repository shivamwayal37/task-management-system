spring:
  cache:
    type: redis
    cache-names: users,tasks
    redis:
      time-to-live: ${CACHE_TTL:10m}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:30000}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:task-management-notifications}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.portfolio.task_management_system.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate.SQL: WARN
    com.portfolio.task_management_system: INFO

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3000000}

rate-limit:
  capacity: ${RATE_LIMIT_CAPACITY:100}
  refill-duration: ${RATE_LIMIT_REFILL_DURATION:1m}
  cleanup-interval: ${RATE_LIMIT_CLEANUP_INTERVAL:5m}
  bucket-ttl: ${RATE_LIMIT_BUCKET_TTL:15m}

app:
  kafka:
    topics:
      task-events: ${TASK_EVENTS_TOPIC:task-events}
  notifications:
    digest-rate: ${NOTIFICATION_DIGEST_RATE:1h}
